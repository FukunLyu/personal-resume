# Skills, Projects, Contact
content:
  - title: Skills
    layout: text
    content: |
      **编程基础：** C、C++、Python

      **Web 与数据存储：** Flask、MySQL；在项目中使用 HTML、CSS、JavaScript 完成交互页面

