  - title: Projects
    layout: list
    content:
      - layout: top
        title: 粤港澳大湾区低空经济产业孵化与区域攀比政策分析
        sub_title: 中观经济学课程论文与配套数据分析项目
        quote: >
          分析粤港澳大湾区城市在低空经济赛道中的政策竞争特征，并检验多维政策信号与低空经济技术创新产出之间的关系。
        description: |
          **主要工作**

          - 整理并分析 345 份粤港澳大湾区低空经济政策文本。
          - 使用大语言模型对扶持力度、监管强度、政策确定性和综合情感进行结构化量化。
          - 将政策指标与 2019—2024 年城市专利及宏观面板数据匹配，并使用双向固定效应面板回归控制城市经济发展水平、人口规模、科技财政支出、城市固定效应和年份固定效应。
          - 使用 Python 完成数据采集、清洗、统计分析和可视化，并整理课程论文。

          **技术与工具：** Python、requests、BeautifulSoup、pandas、NumPy、SciPy、statsmodels、大语言模型、Matplotlib、Seaborn、Word

          **可公开结果**

          - 345 份政策的确定性均值为 73.8，扶持强度均值为 56.4，监管强度均值为 30.7。
          - 扶持力度与综合情感分的相关系数为 0.92；监管强度与综合情感分的相关系数为 -0.70。
          - 双向固定效应模型中，政策综合得分系数为 0.0026，p = 0.285，未显示显著的直接促进作用。
          - 科技财政支出系数为 0.5012，在 10% 显著性水平上为正；人口规模的系数在 1% 显著性水平上为负。

          **表述边界：** 以上为特定样本与模型中的统计结果，不代表普遍结论或确定因果关系；“政策综合得分不显著”不等于“政策没有作用”。

