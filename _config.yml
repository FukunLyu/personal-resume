        title: 十五运会及残特奥会随车志愿者组长
        caption: 2025.11 — 2025.12
        description: 负责志愿者到岗、任务分配及临时调整，与车长沟通，参与交通接驳和现场服务协调。
  - title: 证书
    id: certifications
    layout: text
    content: |
      - 深港澳金融科技师（SHMFTPP）一级，2026 年 7 月。
      - OPC-AI Certified Agent Architect（Foundations），深圳大学普蓝实验室 OPC-AI 团队，2026 年 7 月。
  - title: 联系方式
    id: contact
    layout: text
    content: |
      - [访问 GitHub 主页](https://github.com/LvFuKun){:target="_blank" rel="noopener noreferrer"}
