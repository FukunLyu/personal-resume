        title: 深圳大学金融科技学院 × 法国南特高等商学院
        sub_title: 信息管理与信息系统 / 区块链与信息系统
        caption: 2024 — 2028
        description: |
          全日制联合本科项目，BSc，全英教学。

          重点方向：金融分析、计量经济学、数据库、数据可视化与信息系统。

          英语：雅思 6.0（2026 年 9 月）。
  - title: 实习经历
    id: experience
    layout: list
    content:
      - layout: top
        title: 软通智慧信息技术有限公司
        sub_title: 项目实施部助理
        caption: 2025.07 — 2025.08
        description: |
          - 参与罗湖区现代化治理一体化平台项目，协助项目经理整理项目文档与汇报材料，分类归档并更新资料。
          - 协助检查材料格式、信息完整性及版本一致性，整理需补充或修订的内容并反馈。
  - title: 项目经历
    id: projects
    layout: list
    content:
      - layout: top
        title: 广东省低空经济政策分析
        sub_title: 政策数据分析 · 研究与结果解释
        caption: 2026.06 — 2026.07
        description: |
          - 整理五座广东城市 2019—2026 年的 1,527 条政策文本，筛选 131 条有效政策，按四个维度评分，并匹配城市—季度新增企业注册数。
          - 负责分析结果整理、结论表达及 Granger 检验与 Panel VAR 结果解释。
          - 政策综合情感分对后续新增企业数存在统计预测关系（F = 14.431，p = 0.0002）；该结果不构成因果证据。
      - layout: top
        title: 金融文献分析自动化
        sub_title: 文献处理自动化 · 输出校验与质量控制
        caption: 2026.07
        description: |
          - 参与语料盘点、PDF / Markdown 路由、结构化卡片、分批校验及报告导出流程，处理 43 篇金融文献并产出 43 张卡片、6 个综合包及 52 页报告。
          - 检查字段、格式和章节／页码／表格定位，抽样对照原论文，记录并复核重复、失败及警告项。
          - 最终记录为 43 项有效、0 项失败、0 项警告；校验覆盖完整性、格式和可追溯性，不代表所有提取内容均准确。
      - layout: top
        title: 外卖系统原型
        sub_title: 业务流程与数据库应用
        description: |
          - 梳理顾客、商家与骑手多角色流程，覆盖菜品查询、下单、订单跟踪和配送状态。
          - 使用 Flask、MySQL 及 HTML / CSS / JavaScript，实践 JWT 认证、BI 看板及接口设计。
  - title: 专业技能
    id: skills
    layout: text
    content: |
      **数据处理与分析：** Python、pandas、NumPy、statsmodels；具备数据清洗、统计分析与自动化处理经验。

      **数据库与原型开发：** MySQL、Flask、HTML / CSS / JavaScript；具备多角色业务流程与数据库应用实践。

      **研究方法：** 政策文本量化、面板数据构建、Granger 检验与 Panel VAR。

      **金融与办公工具：** Bloomberg Terminal、Excel、PowerPoint、Gretl。
  - title: 实践经历
    id: activities
    layout: list
    content:
