<div class="container intro-container">
  <h2 id="about">{{ resume.about_title | escape }}</h2>
  <div class="row clearfix">
    {%- if site.about_profile_image -%}
      <div class="col-xs-12 col-sm-4 col-md-3 no-print">
        <img class="profile-img" src="{{ site.about_profile_image | relative_url }}" alt="{{ resume.photo_alt | escape }}">
      </div>
    {%- endif -%}
    <div class="{{ 'col-xs-12 ' }}{%- if site.about_profile_image -%}col-sm-8 col-md-9 col-print-12{%- endif -%}">
      {{ resume.about_content | strip | markdownify }}
    </div>
  </div>
</div>
