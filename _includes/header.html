<header class="hero no-print">
  <div class="container hero-container">
    <nav class="site-nav" aria-label="页面导航">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="hero-content">
      <h1>{{ site.name | escape }}</h1>
      <p class="hero-summary">{{ site.title | escape }}</p>

      {%- if site.hero_actions -%}
        <div class="hero-actions" aria-label="主要操作">
          {%- for action in site.hero_actions -%}
            <a
              class="hero-action{% if forloop.first %} hero-action--primary{% endif %}"
              href="{{ action.url | escape }}"
              {% if action.external %}target="_blank" rel="noopener noreferrer"{% endif %}
            >{{ action.label | escape }}</a>
          {%- endfor -%}
        </div>
      {%- endif -%}
    </div>
  </div>
</header>
