<header class="hero no-print">
  <div class="container hero-container">
    <nav class="site-nav" aria-label="{{ resume.nav_label | escape }}">
      <a class="language-toggle" href="{{ resume.language_url | relative_url }}" lang="{% if page.locale == 'en' %}zh-CN{% else %}en{% endif %}" hreflang="{% if page.locale == 'en' %}zh-CN{% else %}en{% endif %}" aria-label="{{ resume.language_title | escape }}" title="{{ resume.language_title | escape }}">{{ resume.language_label | escape }}</a>
      {% for link in resume.navigation %}
        <a href="#{{ link.id }}">{{ link.label | escape }}</a>
      {% endfor %}
      <button
        class="theme-toggle"
        type="button"
        aria-label="{{ resume.theme_dark_label | escape }}"
        aria-pressed="false"
        title="{{ resume.theme_dark_label | escape }}"
        data-dark-label="{{ resume.theme_dark_label | escape }}"
        data-light-label="{{ resume.theme_light_label | escape }}"
      >
        <span class="fas fa-adjust" aria-hidden="true"></span>
      </button>
    </nav>

    <div class="hero-content">
      <h1>{{ resume.name | escape }}</h1>
      <p class="hero-summary">{{ resume.title | escape }}</p>

      {%- if resume.hero_actions -%}
        <div class="hero-actions" aria-label="{{ resume.actions_label | escape }}">
          {%- for action in resume.hero_actions -%}
            <a
              class="hero-action{% if forloop.first %} hero-action--primary{% endif %}"
              href="{{ action.url | escape }}"
              {% if action.external %}target="_blank" rel="noopener noreferrer"{% endif %}
            >{{ action.label | escape }}</a>
          {%- endfor -%}
        </div>
      {%- endif -%}
    </div>
  </div>
</header>
